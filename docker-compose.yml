version: '3.8'

services:
  xteve:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - XTEVE_HOME=/home/xteve
        - XTEVE_PORT=34400
        - XTEVE_TEMP=/tmp/xteve
        - TZ=Europe/Moscow
    container_name: xteve
    restart: unless-stopped
    ports:
      - "34400:34400"
    environment:
      - TZ=Europe/Moscow
      - XTEVE_PORT=34400
      - XTEVE_HOME=/home/xteve
      - XTEVE_TEMP=/tmp/xteve
    volumes:
      - ./data:/home/xteve
      - ./temp:/tmp/xteve
      - /etc/localtime:/etc/localtime:ro
    networks:
      - xteve-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${XTEVE_PORT:-34400}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  xteve-network:
    driver: bridge

volumes:
  xteve-config:
    driver: local
  xteve-temp:
    driver: local