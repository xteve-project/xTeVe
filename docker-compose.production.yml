services:
  xteve:
    image: ghcr.io/ekzoman/xteve:latest
    restart: always
    environment:
      - TZ=Europe/Moscow
      - XTEVE_PORT=34400
      - XTEVE_HOME=/home/xteve
      - XTEVE_TEMP=/tmp/xteve
    ports:
      - 34400:34400
    networks:
      - xteve-network
    volumes:
      - xteve_data:/home/xteve
      - xteve_temp:/tmp/xteve
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${XTEVE_PORT:-34400}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
networks:
  xteve-network:
    driver: bridge
volumes:
  xteve_data:
  xteve_temp: